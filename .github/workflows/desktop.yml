# CI for desktop/: Windows x64 and Linux x86_64 on pushes and pull requests (with the Linux smoke
# test); all four platforms (plus Windows ARM64 and Linux aarch64) when run by hand. Tagged
# releases go through release.yml.
name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop*.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop*.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      full: ${{ github.event_name == 'workflow_dispatch' }}
