[package]
name = "quicktranslate"
version = "0.1.0"
description = "Select text, press Ctrl+C twice, get a translation (Windows / Linux)"
authors = ["QuickTranslate contributors"]
license = "MIT"
repository = "https://github.com/longfin/quick-translate"
edition = "2021"

[lib]
# A distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "quicktranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# engine (Phase 1)
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Trigger (Phase 2): clipboard text read (later also the copy button's write), single-press hotkey.
arboard = { version = "3", default-features = false }
tauri-plugin-global-shortcut = "2"
# Panel (Phase 3): the system languages, for the default target / fallback language.
sys-locale = "0.3"
# Language detection (Phase 5): Latin-script languages (trigram model, ~80 KB crate, no default features).
whatlang = { version = "0.18", default-features = false }
# Settings (Phase 4): "Run at startup" (HKCU Run key on Windows, XDG autostart .desktop on Linux).
tauri-plugin-autostart = "2"

[target.'cfg(unix)'.dependencies]
# setsid() / killpg for process-tree cancellation (already in the tree via tokio).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects for process-tree cancellation (engine) and the clipboard listener (trigger);
# already in the tree via tauri.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Dev-only macOS clipboard watcher (the shipped macOS app is the Swift one).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
