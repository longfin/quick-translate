<!-- Tray glyph: the macOS menu bar icon (the Swift app's `generate.swift`, `menuBarImage`) in
     white + alpha, for dark Windows / Linux panels. Regenerate the PNGs with
     desktop/scripts/build-tray-icons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <defs>
    <mask id="knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <!-- the front bubble grown by 1.1, so the back bubble keeps a gap around it -->
      <rect x="5.9" y="6.7" width="12.7" height="10.2" rx="3.4" fill="#000"/>
      <path d="M15.54 15.9 L13.51 15.9 L16.56 18.74 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#knockout)">
      <!-- back bubble outline with a heavy "A" -->
      <path fill-rule="evenodd" d="M3.1 2 H9.4 A2.6 2.6 0 0 1 12 4.6 V8.4 A2.6 2.6 0 0 1 9.4 11 H3.1 A2.6 2.6 0 0 1 0.5 8.4 V4.6 A2.6 2.6 0 0 1 3.1 2 Z
               M3.4 3.3 H9.1 A1.6 1.6 0 0 1 10.7 4.9 V8.1 A1.6 1.6 0 0 1 9.1 9.7 H3.4 A1.6 1.6 0 0 1 1.8 8.1 V4.9 A1.6 1.6 0 0 1 3.4 3.3 Z"/>
      <path fill-rule="evenodd" d="M5.6 4.05 H6.9 L8.55 8.95 H7.25 L6.92 7.9 H5.58 L5.25 8.95 H3.95 Z M6.25 5.45 L6.66 6.85 H5.84 Z"/>
    </g>
    <!-- front bubble, solid, tail bottom right -->
    <rect x="7" y="7.8" width="10.5" height="8" rx="2.4"/>
    <path d="M15.34 14.8 L13.66 14.8 L16.06 17.24 Z"/>
  </g>
</svg>
